name: Native runner availability
on:
  workflow_dispatch:
permissions: {}
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2
    steps:
      - name: Report native runtime
        run: node -e "console.log(process.platform, process.arch)"
